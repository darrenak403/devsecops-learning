# API: env từ beyond8-mfa/.env; DATABASE_URL / ASYNC_DATABASE_URL / REDIS_URL bị override
# bên dưới để trỏ tới service trong mạng Docker (db, redis).
#
# Web (build args): mặc định khớp beyond8-mfa-fe/.env. Để build dùng đúng file .env của FE
# (một nguồn): docker compose --env-file ./beyond8-mfa-fe/.env up --build
#
# Compose tự đọc file .env trong thư mục week-02-docker-security (nếu có) để thay thế ${...} trong file này.
#
# Adminer (8080): UI quản lý Postgres — image nhẹ, đủ SQL / bảng / import-export.
#
# Tên project / container / volume dùng tiền tố beyond8 (xem name + container_name + volumes).

name: beyond8

services:
  db:
    container_name: beyond8-db
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: beyond8
      POSTGRES_PASSWORD: beyond8
      POSTGRES_DB: beyond8_mfa
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beyond8 -d beyond8_mfa"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    container_name: beyond8-redis
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  adminer:
    container_name: beyond8-adminer
    image: adminer:4
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      db:
        condition: service_healthy

  api:
    container_name: beyond8-api
    build:
      context: ./beyond8-mfa
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - path: ./beyond8-mfa/.env
        required: true
    environment:
      DATABASE_URL: postgresql+psycopg2://beyond8:beyond8@db:5432/beyond8_mfa
      ASYNC_DATABASE_URL: postgresql+asyncpg://beyond8:beyond8@db:5432/beyond8_mfa
      REDIS_ENABLED: "true"
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    container_name: beyond8-web
    build:
      context: ./beyond8-mfa-fe
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Learning Source Auth}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
        NEXT_PUBLIC_ENV: ${NEXT_PUBLIC_ENV:-development}
        NEXT_PUBLIC_COOKIE_DOMAIN: ${NEXT_PUBLIC_COOKIE_DOMAIN:-.localhost}
    env_file:
      - path: ./beyond8-mfa-fe/.env
        required: false
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
    name: beyond8_pgdata
